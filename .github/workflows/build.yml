name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Localizar o projeto
        id: proj
        shell: bash
        run: |
          achar() { find . -name package.json -not -path './.git/*' -not -path '*/node_modules/*' | head -n 1; }
          P=$(achar)
          if [ -z "$P" ]; then
            Z=""; T=0
            while IFS= read -r f; do
              t=$(git log -1 --format=%ct -- "$f")
              t=${t:-0}
              if [ "$t" -ge "$T" ]; then T=$t; Z="$f"; fi
            done < <(find . -maxdepth 2 -name '*.zip' -not -path './.git/*')
            if [ -n "$Z" ]; then
              echo "Extraindo o zip mais recente: $Z"
              unzip -o "$Z" -d projeto-extraido
              P=$(achar)
            fi
          fi
          if [ -z "$P" ]; then
            echo "::error::package.json não encontrado. Envie os arquivos de dentro do projeto.zip (package.json, capacitor.config.json e a pasta www)."
            echo "Arquivos no repositório:"
            find . -path ./.git -prune -o -type f -print | head -40
            exit 1
          fi
          echo "Projeto em: $(dirname "$P")"
          echo "dir=$(dirname "$P")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        working-directory: ${{ steps.proj.outputs.dir }}
        run: npm install

      - name: Criar projeto Android
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          npx cap add android
          npx cap sync android

      - name: Compilar APK
        working-directory: ${{ steps.proj.outputs.dir }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Renomear APK
        run: cp "${{ steps.proj.outputs.dir }}/android/app/build/outputs/apk/debug/app-debug.apk" radar-roblox.apk

      - uses: actions/upload-artifact@v4
        with:
          name: radar-roblox-apk
          path: radar-roblox.apk

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Radar Roblox v${{ github.run_number }}
          files: radar-roblox.apk
